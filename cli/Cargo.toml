[package]
name = "rustling-cli"
version = "0.1.0"
edition = "2024"
description = "The rustling command: chat, generate and an OpenAI-compatible server for Inkling 2 Mini"
license = "MIT OR Apache-2.0"
readme = "../README.md"

[[bin]]
name = "rustling"
path = "src/main.rs"

[features]
split-attention = ["rustling/split-attention"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = "0.29.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ignore = "0.4.35"
manifatura = { version = "0.2.0", default-features = false, features = ["kit", "store-jsonl", "tools", "mcp", "skills"] }
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["scrolling-regions"] }
ratatui-textarea = "0.9.4"
rayon = "1.12.0"
rustling = { path = ".." }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing-subscriber = "0.3.23"
tui-markdown = { version = "0.3.13", default-features = false }
unicode-width = "0.2"
