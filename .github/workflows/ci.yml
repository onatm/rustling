name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Apple silicon: the only platform rustling supports.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-targets
      # The tests that need a model skip themselves: none is downloaded here.
      - run: cargo test --release
